name: WARP test
on:
  push:
    branches: [warp-test]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: full x86_64 download via build helpers with curl-impersonate
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/lexiforest/curl-impersonate/releases/download/v2.3.2/curl-impersonate-v2.3.2.x86_64-linux-gnu.tar.gz | tar xz -C /tmp
          export CURL=/tmp/curl_firefox144
          source utils.sh
          HTMLQ=bin/htmlq/htmlq-x86_64
          mkdir -p temp
          get_apkmirror_resp https://www.apkmirror.com/apk/google-inc/youtube-music
          dl_apkmirror https://www.apkmirror.com/apk/google-inc/youtube-music 9.15.51 x64.apk x86_64 ""
          ls -la x64.apk
          unzip -l x64.apk | grep -oE 'lib/[^/]+/' | sort -u
